permissions:  
  contents: write
  attestations: write
  id-token: write

- name: Generate artifact attestation
  uses: actions/attest-build-provenance@v4
  with:
    subject-path: |
      release/main.js
      release/styles.css

- name: Create GitHub Release
  uses: softprops/action-gh-release@v2
  with:
    files: |
      release/main.js
      release/manifest.json
      release/styles.css