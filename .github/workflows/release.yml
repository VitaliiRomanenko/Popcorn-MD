name: Release

on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: write
  actions: read
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-artifacts
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
